<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedShield v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/chatbot.css">
</head>
<body>
<div class="app-shell">
    <aside class="left-panel" id="workflowPanel">
        <div class="panel-header">
            <h3>Workflow</h3>
            <button class="ghost-btn" id="toggleWorkflow" type="button">Hide</button>
        </div>
        <div class="workflow-timeline" id="workflowTimeline"></div>
    </aside>

    <main class="chat-shell">
        <header class="topbar">
            <div>
                <h1>MedShield</h1>
                <p class="subtitle">Privacy-preserving medical assistant</p>
            </div>
            <div class="status-row">
                <span class="badge" id="sessionBadge">Session: -</span>
                <span class="badge" id="memoryBadge">Memory: idle</span>
            </div>
        </header>

        <section class="messages" id="chatMessages"></section>

        <footer class="input-bar">
            <form id="chatForm" class="input-form">
                <textarea id="messageInput" rows="1" maxlength="2000" placeholder="Ask MedShield anything..."></textarea>
                <button type="submit" id="sendButton" class="send-btn">Send</button>
            </form>
        </footer>
    </main>

    <aside class="right-panel">
        <section class="panel-block">
            <div class="panel-header">
                <h3>Active Agent</h3>
            </div>
            <div id="agentActivity" class="agent-activity">Awaiting message…</div>
        </section>

        <section class="panel-block">
            <div class="panel-header">
                <h3>Privacy Masking</h3>
                <button class="ghost-btn" id="togglePrivacy" type="button">Collapse</button>
            </div>
            <div id="privacyPanel" class="privacy-panel"></div>
        </section>
    </aside>
</div>

<script src="/static/js/chat.js"></script>
</body>
</html>
